name: Localization Editor for Windows

on:
  push:
    branches: [localization-infrastructure]
    paths:
      - "localization/**"
      - "LEKMOD/Art/**"
      - "LEKMOD/Override/CIV5Units_Mongol.xml"
      - ".github/workflows/localization-editor-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editor:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m pip install "pyinstaller==6.22.3" "cryptography>=45,<47"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LekmodLocalizationEditor --paths localization/tools --add-data "localization/editor/favicon.svg;." --add-data "localization/reference/lekmod-versions.json.gz;." --add-data "localization/reference/vanilla-fingerprints.json.gz;." localization/tools/editor_main.py
      - name: Package contributor files
        shell: pwsh
        run: |
          python -B localization/tools/package_editor.py --exe dist/LekmodLocalizationEditor.exe --output dist/LekmodLocalizationEditor-Windows.zip
      - name: Smoke test executable and packaged inputs
        shell: pwsh
        run: |
          python -B localization/tools/test_portable_editor.py --archive dist/LekmodLocalizationEditor-Windows.zip
      - name: Smoke test windowless updater and localhost restart
        shell: pwsh
        run: |
          python -B localization/tools/test_windows_updater.py --archive dist/LekmodLocalizationEditor-Windows.zip
      - name: Verify snapshot encryption on Windows
        shell: pwsh
        run: |
          python -B -W error::ResourceWarning -m unittest discover -s localization/tools/tests -p test_snapshot_cloud.py -q
      - name: Publish versioned Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $editor = Get-Content localization/editor/version.json -Raw | ConvertFrom-Json
          $tag = $editor.release_tag
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/LekmodLocalizationEditor-Windows.zip `
              --target $env:GITHUB_SHA --title "Lekmod Localization Editor $($editor.version)" `
              --notes "Portable Windows localization editor. Extract the ZIP before launching."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Verify upgrades from released editors and repair current version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force dist/published | Out-Null
          $editor = Get-Content localization/editor/version.json -Raw | ConvertFrom-Json
          gh release download $editor.release_tag --pattern LekmodLocalizationEditor-Windows.zip --dir dist/published
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($previous in @('editor-v0.11', 'editor-v0.12', 'editor-v0.13', 'editor-v0.14', 'editor-v0.15', 'editor-v0.16', 'editor-v0.17', 'editor-v0.18')) {
            $folder = "dist/previous-$previous"
            New-Item -ItemType Directory -Force $folder | Out-Null
            gh release download $previous --pattern LekmodLocalizationEditor-Windows.zip --dir $folder
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $upgradeArgs = @(
              '--old-archive', "$folder/LekmodLocalizationEditor-Windows.zip",
              '--new-archive', 'dist/published/LekmodLocalizationEditor-Windows.zip'
            )
            if ($previous -eq 'editor-v0.17') { $upgradeArgs += @('--test-repair', '--connected-project', '--test-reference-migration') }
            if ($previous -eq 'editor-v0.18') { $upgradeArgs += @('--test-repair', '--connected-project') }
            python -B localization/tools/test_editor_upgrade_online.py @upgradeArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LekmodLocalizationEditor-Windows
          path: dist/LekmodLocalizationEditor-Windows.zip
          if-no-files-found: error

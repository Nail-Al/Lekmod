name: Localization Editor for Windows

on:
  push:
    branches: [localization-infrastructure, editor-v025-workflow, editor-v026-workflow]
    paths:
      - "localization/**"
      - "LEKMOD/Art/**"
      - "LEKMOD/Override/CIV5Units_Mongol.xml"
      - ".github/workflows/localization-editor-windows.yml"
  workflow_dispatch:
    inputs:
      full_upgrade_matrix:
        description: Check every historical editor instead of the current and legacy lock cases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  editor:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate runtime XML from reviewed sources
        shell: pwsh
        run: |
          python -B localization/tools/sync_primary_english.py --write
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -B localization/tools/build_shipped_localization.py --vanilla-reference localization/reference/vanilla-fingerprints.json.gz --write
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m pip install "pyinstaller==6.22.3" "cryptography>=45,<47"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LekmodLocalizationEditor --paths localization/tools --add-data "localization/editor/favicon.svg;." --add-data "localization/reference/lekmod-versions.json.gz;." --add-data "localization/reference/vanilla-fingerprints.json.gz;." localization/tools/editor_main.py
      - name: Regression test fast local drafts and batch Apply on Windows
        shell: pwsh
        run: |
          python -B -W error::ResourceWarning -m unittest discover -s localization/tools/tests -p test_editor_drafts.py -q
      - name: Package contributor files
        shell: pwsh
        run: |
          python -B localization/tools/package_editor.py --exe dist/LekmodLocalizationEditor.exe --output dist/LekmodLocalizationEditor-Windows.zip
      - name: Smoke test executable and packaged inputs
        shell: pwsh
        run: |
          python -B localization/tools/test_portable_editor.py --archive dist/LekmodLocalizationEditor-Windows.zip
      - name: Smoke test windowless updater and localhost restart
        shell: pwsh
        run: |
          python -B localization/tools/test_windows_updater.py --archive dist/LekmodLocalizationEditor-Windows.zip
      - name: Regression test locked EXE, partial rollback, and bounded recovery
        shell: pwsh
        run: |
          python -B localization/tools/test_windows_updater.py --archive dist/LekmodLocalizationEditor-Windows.zip --locks-only
      - name: Verify snapshot encryption on Windows
        shell: pwsh
        run: |
          python -B -W error::ResourceWarning -m unittest discover -s localization/tools/tests -p test_snapshot_cloud.py -q
      - name: Regression test menu text and game localization database constraints
        shell: pwsh
        run: |
          python -B -W error::ResourceWarning -m unittest discover -s localization/tools/tests -p test_runtime_xml.py -q
      - name: Persist verified generated game XML
        if: github.ref == 'refs/heads/localization-infrastructure'
        shell: pwsh
        run: |
          git add -- LEKMOD/Override/CIV5Units_Mongol.xml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh verified generated localization for the editor release"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git push origin HEAD:localization-infrastructure
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } elseif ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Publish versioned Windows download
        if: github.ref == 'refs/heads/localization-infrastructure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $editor = Get-Content localization/editor/version.json -Raw | ConvertFrom-Json
          $tag = $editor.release_tag
          $releaseCommit = git rev-parse HEAD
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/LekmodLocalizationEditor-Windows.zip `
              --target $releaseCommit --title "Lekmod Localization Editor $($editor.version)" `
              --notes "Portable Windows localization editor. Extract the ZIP before launching."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Verify upgrades from released editors and repair current version
        if: github.ref == 'refs/heads/localization-infrastructure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_UPGRADE_MATRIX: ${{ inputs.full_upgrade_matrix }}
        run: |
          New-Item -ItemType Directory -Force dist/published | Out-Null
          $editor = Get-Content localization/editor/version.json -Raw | ConvertFrom-Json
          gh release download $editor.release_tag --pattern LekmodLocalizationEditor-Windows.zip --dir dist/published --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Updater code is unchanged. Exercise the current release plus the
          # two legacy duplicate/lock cases on each build; keep the complete
          # historical sweep available for changes to the updater itself.
          $previousVersions = @('editor-v0.17', 'editor-v0.19', 'editor-v0.24', 'editor-v0.25')
          if ($env:FULL_UPGRADE_MATRIX -eq 'true') {
            $previousVersions = @('editor-v0.11', 'editor-v0.12', 'editor-v0.13', 'editor-v0.14', 'editor-v0.15', 'editor-v0.16', 'editor-v0.17', 'editor-v0.18', 'editor-v0.19', 'editor-v0.20', 'editor-v0.21', 'editor-v0.22', 'editor-v0.23', 'editor-v0.24', 'editor-v0.25')
          }
          foreach ($previous in $previousVersions) {
            $folder = "dist/previous-$previous"
            New-Item -ItemType Directory -Force $folder | Out-Null
            gh release download $previous --pattern LekmodLocalizationEditor-Windows.zip --dir $folder
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $upgradeArgs = @(
              '--old-archive', "$folder/LekmodLocalizationEditor-Windows.zip",
              '--new-archive', 'dist/published/LekmodLocalizationEditor-Windows.zip'
            )
            if ($previous -eq 'editor-v0.17') { $upgradeArgs += @('--test-repair', '--connected-project', '--test-reference-migration', '--test-extra-instance') }
            if ($previous -eq 'editor-v0.18') { $upgradeArgs += @('--test-repair', '--connected-project') }
            if ($previous -eq 'editor-v0.19') { $upgradeArgs += @('--test-repair', '--connected-project', '--test-extra-instance') }
            if ($previous -in @('editor-v0.20', 'editor-v0.21', 'editor-v0.22', 'editor-v0.23', 'editor-v0.24', 'editor-v0.25')) { $upgradeArgs += @('--test-repair', '--connected-project') }
            python -B localization/tools/test_editor_upgrade_online.py @upgradeArgs
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LekmodLocalizationEditor-Windows
          path: dist/LekmodLocalizationEditor-Windows.zip
          if-no-files-found: error

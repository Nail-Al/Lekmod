name: Localization Audit

on:
  push:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  pull_request:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate localization data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install snapshot encryption dependency
        run: python -m pip install "cryptography>=45,<47"

      - name: Generate runtime XML from reviewed sources
        run: |
          python -B localization/tools/sync_primary_english.py --write
          python -B localization/tools/build_shipped_localization.py --vanilla-reference localization/reference/vanilla-fingerprints.json.gz --write

      - name: Run configured read-only checks
        run: python -B localization/tools/manage.py check --ci


  editor-ui:
    name: Verify editor Save, history and Apply controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            localization/editor
            localization/tools/tests/editor_ui.cjs
            localization/tools/tests/editor_layout.cjs
          sparse-checkout-cone-mode: false
      - name: Test actual browser interface
        run: |
          node --check localization/editor/app.js
          npm install --prefix "$RUNNER_TEMP/lle-ui" --no-save jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/lle-ui/node_modules" node localization/tools/tests/editor_ui.cjs
      - name: Verify search control geometry in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/lle-ui" --no-save jsdom@26.1.0 playwright@1.56.0
          "$RUNNER_TEMP/lle-ui/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/lle-ui/node_modules" node localization/tools/tests/editor_layout.cjs

  snapshot-collector:
    name: Verify snapshot collection on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Capture and combine language tables with closed database handles
        run: python -B -W error::ResourceWarning -m unittest discover -s localization/tools/tests -p test_collect_vanilla.py -q

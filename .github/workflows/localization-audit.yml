name: Localization Audit

on:
  push:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "tools/localization/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  pull_request:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "tools/localization/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate localization data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run localization audit
        run: python tools/localization/audit_localization.py --strict

      - name: Audit primary localization source
        run: python tools/localization/audit_primary_localization.py --strict

      - name: Check generated English game text
        run: python tools/localization/sync_primary_english.py

      - name: Inventory localization sources
        run: python tools/localization/inventory_localization.py --strict

      - name: Test localization tools
        run: python -m unittest discover -s tools/localization/tests -v

name: Localization Audit

on:
  push:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  pull_request:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate localization data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install snapshot encryption dependency
        run: python -m pip install "cryptography>=45,<47"

      - name: Run configured read-only checks
        run: python -B localization/tools/manage.py check --ci

  snapshot-collector:
    name: Verify snapshot collection on Windows
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Capture and combine language tables with closed database handles
        run: python -B -W error::ResourceWarning -m unittest discover -s localization/tools/tests -p test_collect_vanilla.py -q

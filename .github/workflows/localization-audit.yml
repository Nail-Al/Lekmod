name: Localization Audit

on:
  push:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  pull_request:
    paths:
      - "LEKMOD/**"
      - "Lekmap/**"
      - "LEKMOD_DLL/**"
      - "LekmodInstaller/**"
      - "localization/**"
      - ".github/workflows/localization-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate localization data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run configured read-only checks
        run: python -B localization/tools/manage.py check --ci

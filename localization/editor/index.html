<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lekmod Localization Editor</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #222a35; background: #f5f7fb; }
    body { margin: 0; }
    header { padding: 18px 24px; background: #172b44; color: white; }
    h1 { font-size: 1.3rem; margin: 0 0 5px; }
    header p { margin: 0; color: #c7d6e8; font-size: .9rem; }
    main { padding: 16px 24px; display: grid; gap: 14px; }
    .bar, .panel, .grid { background: white; border: 1px solid #dce3eb; border-radius: 9px; }
    .bar { padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { font-size: .85rem; display: grid; gap: 4px; }
    select, input, textarea, button { font: inherit; }
    select, input, textarea { border: 1px solid #aebbc9; border-radius: 5px; padding: 7px 9px; background: white; }
    #search { min-width: 260px; }
    button { border: 0; border-radius: 5px; padding: 9px 14px; background: #20578e; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    details { position: relative; }
    details summary { cursor: pointer; }
    .columns { position: absolute; z-index: 2; right: 0; width: 225px; max-height: 320px; overflow: auto;
      padding: 12px; box-shadow: 0 8px 18px #162c4350; background: white; border: 1px solid #dce3eb; }
    .columns label { display: flex; align-items: center; gap: 7px; padding: 3px 0; }
    .grid { overflow: auto; max-height: 59vh; }
    table { border-collapse: collapse; width: 100%; min-width: 1080px; table-layout: auto; }
    th, td { border-bottom: 1px solid #e6ebf0; padding: 9px; text-align: left; vertical-align: top;
      min-width: 115px; max-width: 430px; white-space: pre-wrap; overflow-wrap: anywhere; }
    th { position: sticky; top: 0; background: #edf3f8; resize: horizontal; overflow: auto; z-index: 1; }
    tr:hover, tr.selected { background: #e8f1fa; cursor: pointer; }
    table.nowrap td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pager { display: flex; gap: 12px; align-items: center; padding: 8px 12px; }
    .panel { padding: 16px; }
    .panel h2 { font-size: 1.1rem; margin: 0 0 8px; }
    .panel p { margin: 5px 0 12px; }
    .panel textarea { width: min(100%, 960px); min-height: 115px; box-sizing: border-box; resize: both; }
    .fields { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; }
    .fields input { width: 200px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    .hint { color: #5d6d80; font-size: .85rem; }
    .stale { color: #a1411d; font-weight: 700; }
    #message { min-height: 21px; font-weight: 600; }
    @media (max-width: 720px) { main { padding: 10px; } .bar { align-items: stretch; } #search { min-width: 0; } }
  </style>
</head>
<body>
<header><h1>Lekmod Localization Editor</h1><p>Save approved translations to CSV and the game XML. Undo and redo saved edits during this session.</p></header>
<main>
  <section class="bar">
    <label>Language<select id="locale"></select></label>
    <label>Category<select id="category"></select></label>
    <label>Search<input id="search" placeholder="Key or part of the text"></label>
    <label><span>Display</span><span><input type="checkbox" id="wrap" checked> Wrap lines</span></label>
    <details><summary>Columns</summary><div class="columns" id="columns"></div></details>
  </section>
  <section class="grid">
    <table id="table"><thead></thead><tbody></tbody></table>
    <div class="pager"><button id="prev">Previous page</button><span id="count"></span><button id="next">Next page</button></div>
  </section>
  <section class="panel" id="panel">
    <h2 id="selected">Select a row in the table</h2>
    <p id="context" class="hint"></p>
    <label>Text<textarea id="translation" disabled></textarea></label>
    <div class="fields" id="grammar">
      <label>Gender<input id="gender" disabled></label>
      <label>Plurality<input id="plurality" disabled></label>
      <label>Translator note<input id="note" disabled></label>
    </div>
    <p id="characters" class="hint"></p>
    <div class="actions">
      <button id="save" disabled>Save and apply</button>
      <button id="undo" disabled>Undo saved edit</button>
      <button id="redo" disabled>Redo saved edit</button>
      <button id="share" disabled>Download translation ZIP</button>
      <button id="gamexml">Download test game XML</button>
    </div>
    <p class="hint">The ZIP is for a reviewer. The game XML is for a separate local test copy of Lekmod; it is not a complete mod.</p>
    <p id="message" role="status"></p>
  </section>
</main>
<script>
  const token = "{{TOKEN}}";
  const byId = id => document.getElementById(id);
  const columns = [
    ["key", "Key"], ["classification", "Type"], ["vanilla_en_US", "Vanilla EN"],
    ["vanilla_target", "Vanilla translation"], ["lekmod_en_US", "Lekmod EN"],
    ["lekmod_target", "Existing Lekmod translation"], ["translation", "My translation"],
    ["translation_status", "Status"], ["translation_characters", "Characters"]
  ];
  const primaryColumns = [["key", "Key"], ["kind", "Operation"],
    ["text", "English text"], ["characters", "Characters"]];
  let locales = {}, offset = 0, total = 0, chosen = null, primary = false;
  const selectedColumns = new Set([...columns, ...primaryColumns].map(([name]) => name));
  let pendingSearch;

  async function request(path, body) {
    const options = body === undefined ? {} : {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Editor-Token": token},
      body: JSON.stringify(body)
    };
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Request failed");
    return data;
  }
  function status(text, error = false) {
    byId("message").textContent = text;
    byId("message").style.color = error ? "#a62d24" : "#1f6b3a";
  }
  function updateHistoryButtons(state) {
    byId("undo").disabled = !state.undo_available;
    byId("redo").disabled = !state.redo_available;
  }
  function updateCategories() {
    const locale = byId("locale").value, select = byId("category");
    select.replaceChildren();
    for (const [value, label] of [["primary", "Primary · English"],
          ...(locales[locale] || []).map(name => [name, name])]) {
      const option = document.createElement("option");
      option.value = value; option.textContent = label; select.append(option);
    }
    select.value = (locales[locale] || [])[0] || "primary";
    load();
  }
  function updateColumns() {
    const items = primary ? primaryColumns : columns;
    byId("columns").replaceChildren();
    for (const [name, title] of items) {
      const label = document.createElement("label");
      const check = document.createElement("input");
      check.type = "checkbox"; check.checked = selectedColumns.has(name);
      check.addEventListener("change", () => {
        check.checked ? selectedColumns.add(name) : selectedColumns.delete(name);
        load();
      });
      label.append(check, document.createTextNode(title));
      byId("columns").append(label);
    }
  }
  function charCount(value) {
    return Array.from(value.trim().replace(/\s+/g, " ")).length;
  }
  function showRow(row, tr) {
    chosen = row;
    document.querySelectorAll("tbody tr").forEach(item => item.classList.remove("selected"));
    tr.classList.add("selected");
    byId("selected").textContent = row.key + (primary ? " · English" : " · " + byId("locale").value);
    byId("translation").disabled = false; byId("save").disabled = false;
    byId("translation").value = primary ? row.text : row.translation;
    byId("grammar").hidden = primary;
    for (const [field, id] of [["translation_gender", "gender"], ["translation_plurality", "plurality"],
                               ["translator_note", "note"]]) {
      byId(id).disabled = primary; byId(id).value = row[field] || "";
    }
    byId("context").textContent = primary
      ? "Source: localization/en_US/primary.xml · loading last commit date…"
      : "Type: " + row.classification + " · status: " + row.translation_status +
        (row.translation_status === "stale" ? " · old translation is not used in game" : "") +
        " · required tokens: " + row.required_format_tokens +
        " · loading English row date…";
    byId("context").className = row.translation_status === "stale" ? "stale" : "hint";
    byId("characters").textContent = "Characters: " + charCount(byId("translation").value) +
      (primary ? "" : " · English: " + row.lekmod_en_US_characters);
    const historyPath = primary ? "/api/history?index=" + row.index
      : "/api/history?key=" + encodeURIComponent(row.key);
    request(historyPath).then(history => {
      if (chosen !== row) return;
      byId("context").textContent = (primary ? "" : byId("context").textContent.replace(
        " · loading English row date…", "") + " · ") +
        "Last committed English edit: " +
        (history.committed_at || "not committed yet") +
        (history.commit ? " · " + history.commit.slice(0, 8) : "");
    }).catch(() => {
      if (chosen === row) byId("context").textContent += " · Git date unavailable";
    });
    status("");
  }
  async function load() {
    primary = byId("category").value === "primary";
    byId("share").disabled = primary || !byId("locale").value;
    chosen = null;
    byId("save").disabled = true; byId("translation").disabled = true;
    byId("selected").textContent = "Select a row in the table";
    updateColumns();
    try {
      const args = new URLSearchParams({q: byId("search").value, offset});
      if (!primary) { args.set("locale", byId("locale").value); args.set("category", byId("category").value); }
      const result = await request((primary ? "/api/primary?" : "/api/rows?") + args);
      total = result.total;
      const names = (primary ? primaryColumns : columns).filter(([name]) => selectedColumns.has(name));
      const head = document.createElement("tr");
      for (const [, label] of names) { const th = document.createElement("th"); th.textContent = label; head.append(th); }
      document.querySelector("thead").replaceChildren(head);
      const body = document.querySelector("tbody"); body.replaceChildren();
      for (const row of result.rows) {
        const tr = document.createElement("tr");
        for (const [field] of names) { const td = document.createElement("td"); td.textContent = row[field] || ""; tr.append(td); }
        tr.addEventListener("click", () => showRow(row, tr)); body.append(tr);
      }
      byId("count").textContent = total ? `${offset + 1}–${Math.min(offset + 60, total)} of ${total}` : "No rows";
      byId("prev").disabled = offset === 0; byId("next").disabled = offset + 60 >= total;
      status("");
    } catch (error) { status(error.message, true); }
  }
  byId("translation").addEventListener("input", () => {
    byId("characters").textContent = "Characters: " + charCount(byId("translation").value) +
      (primary ? "" : " · English: " + (chosen?.lekmod_en_US_characters || ""));
  });
  byId("save").addEventListener("click", async () => {
    if (!chosen) return;
    byId("save").disabled = true; status("Saving and validating…");
    try {
      let saved;
      if (primary) {
        saved = await request("/api/primary", {index: chosen.index, key: chosen.key,
          old_text: chosen.text, text: byId("translation").value});
      } else {
        saved = await request("/api/translate", {locale: byId("locale").value, category: byId("category").value,
          key: chosen.key, source_fingerprint: chosen.source_fingerprint,
          translation: byId("translation").value, translation_gender: byId("gender").value,
          translation_plurality: byId("plurality").value, translator_note: byId("note").value});
      }
      updateHistoryButtons(saved);
      await load(); status(saved.applied_to_game === false
        ? "Saved. Game XML generation is Off in config.json."
        : "Saved. The changed CSV and game XML are ready for review.");
    } catch (error) { status(error.message, true); byId("save").disabled = false; }
  });
  for (const operation of ["undo", "redo"]) {
    byId(operation).addEventListener("click", async () => {
      byId("undo").disabled = true; byId("redo").disabled = true;
      try {
        const result = await request("/api/" + operation, {});
        updateHistoryButtons(result);
        await load();
        status(operation === "undo" ? "Last saved edit undone." : "Saved edit restored.");
      } catch (error) {
        status(error.message, true);
        updateHistoryButtons(await request("/api/meta"));
      }
    });
  }
  byId("share").addEventListener("click", () => {
    window.location.href = "/api/export?locale=" + encodeURIComponent(byId("locale").value);
    status("Translation package download started. Attach the ZIP to your review or message.");
  });
  byId("gamexml").addEventListener("click", () => {
    window.location.href = "/api/game-xml";
    status("Test XML download started. Use it only with a local test copy of Lekmod.");
  });
  byId("locale").addEventListener("change", () => { offset = 0; updateCategories(); });
  byId("category").addEventListener("change", () => { offset = 0; load(); });
  byId("search").addEventListener("input", () => {
    clearTimeout(pendingSearch); pendingSearch = setTimeout(() => { offset = 0; load(); }, 250);
  });
  byId("wrap").addEventListener("change", () => {
    byId("table").classList.toggle("nowrap", !byId("wrap").checked);
  });
  byId("prev").addEventListener("click", () => { offset -= 60; load(); });
  byId("next").addEventListener("click", () => { offset += 60; load(); });
  request("/api/meta").then(meta => {
    locales = meta.locales;
    updateHistoryButtons(meta);
    for (const locale of Object.keys(locales)) {
      const option = document.createElement("option"); option.value = locale; option.textContent = locale;
      byId("locale").append(option);
    }
    byId("locale").value = locales.RU_RU ? "RU_RU" : Object.keys(locales)[0];
    updateCategories();
  }).catch(error => status(error.message, true));
</script>
</body>
</html>
